trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'ACR-azuredevops'
  imageRepository: 'my-app'                # change to your image name
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

steps:
  - task: Docker@2
    displayName: Build and push image to ACR
    inputs:
      command: buildAndPush
      containerRegistry: $(dockerRegistryServiceConnection)
      repository: $(imageRepository)
      dockerfile: $(dockerfilePath)
      tags: |
        $(tag)
        latest
steps:
  - task: AzureCLI@2
    displayName: Build and push with az acr build
    inputs:
      azureSubscription: 'pipeline_project-my-lab-project'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az acr build --registry <mylab223> --image my-app:$(Build.BuildId) .
